name: Cleanup

# When a branch is deleted (for example after its pull request is merged),
# remove its CI results branch as well.
on: delete

permissions:
  contents: write

jobs:
  ci-results:
    if: github.event.ref_type == 'branch' && !startsWith(github.event.ref, 'ci-results/')
    runs-on: ubuntu-latest
    steps:
      - name: Delete ci-results branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ci-results/${{ github.event.ref }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" > /dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
            echo "Deleted $BRANCH"
          else
            echo "No $BRANCH to delete"
          fi
