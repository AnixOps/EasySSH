name: CI

on:
  push:
    branches-ignore: ["ci-results/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend and screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install fonts for CJK screenshots
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install
        run: mkdir -p logs && npm install 2>&1 | tee logs/npm-install.log
        shell: bash -o pipefail {0}
      - name: Typecheck and build
        run: npm run build 2>&1 | tee logs/frontend-build.log
        shell: bash -o pipefail {0}
      - name: Screenshots
        shell: bash -o pipefail {0}
        run: |
          npx playwright install --with-deps chromium > logs/playwright-install.log 2>&1
          npm run preview > logs/preview.log 2>&1 &
          npx --yes wait-on@8 http://localhost:4173 --timeout 30000
          npm run screenshots -- http://localhost:4173 screenshots 2>&1 | tee logs/screenshots.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: |
            logs/
            screenshots/
            package-lock.json
          if-no-files-found: ignore

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -o pipefail {0}
    steps:
      - uses: actions/checkout@v5
      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend
        run: mkdir -p logs && npm install > logs/npm-install.log 2>&1
      - name: Build frontend
        id: frontend
        run: npm run build 2>&1 | tee logs/frontend-build.log
      # The checks below all run once the frontend is built, so one CI round
      # reports every failure instead of stopping at the first.
      - name: rustfmt
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        run: cargo fmt --all --check 2>&1 | tee logs/fmt.log
      - name: clippy
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee logs/clippy.log
      - name: test
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        run: cargo test --workspace 2>&1 | tee logs/test.log
      - name: Bundle
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        run: npx tauri build 2>&1 | tee logs/bundle.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ runner.os }}
          path: |
            logs/
            Cargo.lock
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: AnixOps-SSH-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Publishes logs and screenshots to the `ci-results/<branch>` branch so they
  # can be read with plain git (no API token or log download needed).
  report:
    name: Publish results
    if: always() && github.event_name == 'push'
    needs: [frontend, rust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
          pattern: "{frontend,logs-*}"
      - name: Push to ci-results branch
        env:
          FRONTEND: ${{ needs.frontend.result }}
          RUST: ${{ needs.rust.result }}
          BRANCH: ${{ github.ref_name }}
        run: |
          cd results
          {
            echo "# CI results for ${BRANCH} @ ${GITHUB_SHA::7}"
            echo
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Frontend and screenshots: ${FRONTEND}"
            echo "- Rust (all platforms): ${RUST}"
          } > SUMMARY.md
          git init -q -b results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI results for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "results:refs/heads/ci-results/${BRANCH}"
