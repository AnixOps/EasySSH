name: 功能建议 / Feature request
description: 缺少某个常用功能。Something you need often is missing.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想做什么 / What are you trying to do
      description: 描述场景，而不是解决方案。The situation, not the solution.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: 多久遇到一次 / How often
      options:
        - 每天 / Daily
        - 每周 / Weekly
        - 偶尔 / Occasionally
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法 / How it could work
  - type: textarea
    id: elsewhere
    attributes:
      label: 其他工具怎么做 / How other tools do it
      description: 例如 Termius、Xshell、FinalShell。For example Termius, Xshell or FinalShell.
