name: 问题反馈 / Bug report
description: 某个功能不正常，或用起来不顺手。Something does not work or feels wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请不要贴出密码、私钥、令牌或完整的服务器地址。
        Do not paste passwords, private keys, tokens or full server addresses.
  - type: textarea
    id: what
    attributes:
      label: 发生了什么 / What happened
      description: 以及你原本期望的结果。And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. 打开主机 …
        2. 点击 …
  - type: input
    id: version
    attributes:
      label: 应用版本 / App version
      description: 设置 → 关于。Settings → About.
      placeholder: "1.0.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 系统 / Operating system
      placeholder: "Windows 11 23H2 / macOS 15.1 / Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: ssh
    attributes:
      label: ssh -V
      placeholder: "OpenSSH_for_Windows_9.5p1, LibreSSL 3.8.2"
  - type: textarea
    id: extra
    attributes:
      label: 截图或报错 / Screenshots or error text
